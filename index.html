<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milk™ Tycoon</title>
  <link rel="icon" type="image/png" href="product1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>

    /* THEME — change these colors to reuse the template for another brand. */
    :root {
      --accent: #8bdeff;
      --panel: rgba(13, 27, 38, .92);
      --border: rgba(177, 220, 242, .22);
      --muted: #a4b9c8;
      --shop-width: 390px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #f4faff;
      background: #172d3e url("background.png") center / cover fixed no-repeat;
      font-family: Arial, sans-serif;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    /* DESKTOP — the left panel stays visible while the store scrolls. */
    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--shop-width);
      height: 100vh;
      height: 100dvh;
    }
    .clicker-panel {
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      text-align: center;
      background: linear-gradient(180deg, rgba(9, 24, 37, .7), rgba(9, 24, 37, .3));
    }
    #game-header {
      position: relative;
      padding: 26px 24px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 22, 33, .55);
    }
    #game-header h1 {
      margin: 0 60px 18px;
      font: 700 clamp(24px, 3vw, 42px) "Fredoka", sans-serif;
    }
    #stats p { margin: 7px 0; }
    #auraCount {
      font: 700 clamp(26px, 3.5vw, 48px) "Fredoka", sans-serif;
      color: var(--accent);
    }
    #auraPerClick, #auraPerSecond { color: #d0dfe9; font-size: 14px; }
    #resetButton {
      position: absolute;
      top: 20px;
      right: 16px;
      padding: 7px 10px;
      border: 1px solid #ba7272;
      border-radius: 8px;
      color: #ffb0b0;
      background: transparent;
      font-size: 12px;
    }
    .click-stage {
      flex: 1;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: radial-gradient(ellipse at center, rgba(116, 201, 255, .24), transparent 65%);
    }
    #auraframe {
      display: block;
      width: min(75%, 350px);
      height: clamp(200px, 34vh, 360px);
      padding: 0;
      border: 0;
      background: transparent;
      transition: transform .12s;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .4));
      user-select: none;
      touch-action: manipulation;
    }
    #auraframe img { width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none; }
    #auraframe:hover { transform: scale(1.04); }
    #auraframe:active { transform: scale(.94); }
    .click-hint { color: #d0dfe9; font-size: 13px; letter-spacing: .08em; }
    #audio-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 12px; }
    #audio-controls button {
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(8, 22, 33, .65);
      color: #e1edf5;
      font-size: 12px;
    }
    #audio-controls button.muted { color: var(--muted); }

    /* BRAND LINKS — keep the same image names when duplicating the game. */
    .product-showcase {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 12px;
      color: white;
      text-decoration: none;
      font: 600 15px "Fredoka", sans-serif;
      text-align: left;
      border-top: 1px solid var(--border);
      background: rgba(8, 22, 33, .45);
    }
    .product-showcase:hover { color: var(--accent); }
    .product-slideshow { position: relative; width: 100px; height: 65px; flex-shrink: 0; }
    .product-slideshow img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: contain;
      opacity: 0; animation: productFade 12s infinite;
    }
    .product-slideshow img:nth-child(2) { animation-delay: 4s; }
    .product-slideshow img:nth-child(3) { animation-delay: 8s; }
    @keyframes productFade {
      0%, 35%, 100% { opacity: 0; }
      8%, 27% { opacity: 1; }
    }
    #company-footer { padding: 12px; background: rgba(8, 22, 33, .65); color: var(--muted); font-size: 12px; }
    #company-footer p { margin: 6px 0 0; }
    #company-footer a { color: var(--accent); }

    /* STORE — exactly one column, regardless of the number of upgrades. */
    .store-panel {
      min-width: 0;
      overflow-y: auto;
      background: var(--panel);
      border-left: 3px solid var(--border);
      scrollbar-color: #55758a #102330;
    }
    .store-heading {
      position: sticky; top: 0; z-index: 2;
      padding: 22px;
      border-bottom: 1px solid var(--border);
      background: #102330;
    }
    .store-heading h2 { margin: 0 0 6px; font: 700 28px "Fredoka", sans-serif; }
    .store-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    #shop { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; }
    .upgrade {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(135deg, #243f51, #192e3e);
    }
    .upgrade h3 { margin: 0 0 8px; font: 600 20px "Fredoka", sans-serif; overflow-wrap: anywhere; }
    .upgrade h3 span { color: var(--accent); font-size: 16px; white-space: nowrap; }
    .upgrade p { margin: 6px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .upgrade .upgrade-cost { color: #f4faff; font-weight: bold; font-size: 14px; }
    /* Only the price number is gray when the balance is insufficient. */
    .upgrade .unaffordable { color: #91a5b4; }
    .upgrade .upgrade-gains { color: var(--accent); font-weight: 600; }
    .upgrade button {
      width: 100%; margin-top: 8px; padding: 10px;
      border: 1px solid var(--border); border-radius: 6px;
      background: #304655; color: #91a5b4;
    }
    .upgrade button:disabled { cursor: not-allowed; }
    .upgrade button.enabled { background: var(--accent); color: #102330; font-weight: bold; }
    .upgrade button.enabled:hover { background: #b9edff; }

    /* OVERLAYS — visible above both panels. */
    .floating-text {
      position: absolute; z-index: 30;
      color: #b7ffcb; font-weight: bold; pointer-events: none;
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      from { opacity: 1; transform: translate(-50%, 0); }
      to { opacity: 0; transform: translate(-50%, -60px); }
    }
    #chad { position: fixed; z-index: 10; width: 100px; opacity: 0; pointer-events: none; transition: opacity 1s; cursor: pointer; -webkit-user-drag: none; }
    #resetDialog { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .75); }
    #resetDialog.visible { display: flex; }
    .dialog-content { max-width: 380px; padding: 28px; border: 1px solid var(--border); border-radius: 14px; background: #102330; text-align: center; }
    .dialog-actions { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .dialog-actions button { padding: 10px 22px; border: 0; border-radius: 6px; color: white; }
    #confirmReset { background: #b33b43; }
    #cancelReset { background: #405b70; }

    /* MOBILE — click area first, followed by the same single-column store. */
    @media (max-width: 700px) {
      .game-layout { height: auto; grid-template-columns: minmax(0, 1fr); }
      .clicker-panel, .store-panel { overflow: visible; }
      .store-panel { border-left: 0; border-top: 3px solid var(--border); }
      .click-stage { min-height: 270px; padding: 20px; }
      #auraframe { height: 220px; width: 250px; max-width: 90%; }
      #game-header { padding: 22px 12px 16px; }
      .store-heading { position: static; }
    }
    @media (prefers-reduced-motion: reduce) {
      #auraframe { transition: none; }
      .product-slideshow img { animation: none; }
      .product-slideshow img:first-child { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Main layout: clicking on the left, upgrades on the right. -->
  <main class="game-layout">
  <section class="clicker-panel" aria-label="Production">
  <div id="game-header">

    <h1>Milk™ Tycoon</h1>
    <div id="stats">
      <p id="auraCount"> Money: 0</p>
      <p id="auraPerClick">Money per click: 1</p>
      <p id="auraPerSecond">Money per second: 0</p>
    </div>
    <button id="resetButton" type="button">Reset</button>
  </div>

  <div class="click-stage">
    <button id="auraframe" type="button" aria-label="Click to earn money">
      <img src="product1.png" alt="Milk product" draggable="false">
    </button>
    <p class="click-hint">CLICK TO GROW YOUR EMPIRE</p>
  </div>
  <div id="audio-controls">
    <button id="musicToggle" type="button">Music : enabled</button>
    <button id="soundToggle" type="button">Sounds : enabled</button>
  </div>
    <a class="product-showcase" href="exemple.html" aria-label="Découvrez nos nouveaux produits">
      <span class="product-slideshow" aria-hidden="true">
        <img src="product1.png" alt="">
        <img src="product2.png" alt="">
        <img src="product3.png" alt="">
      </span>
      <span> Discover our <br> new products !</span>
    </a>
  <footer id="company-footer">
    Discover the brand on <a href="exemple.html">our website</a> <p> • </p> <p> This website was made by <a href="mailto:cedric.proconctact@protonmail.me">
  cedric.proconctact@protonmail.me
</a> </p>
  </footer>
  </section>

  <aside class="store-panel" aria-labelledby="store-title">
    <header class="store-heading">
      <h2 id="store-title">Store</h2>
      <p></p>
    </header>
    <div id="shop"></div>
  </aside>
  </main>

  <img id="chad" src="marque.png" alt="Bonus">

  
  <audio id="backgroundMusic" src="music.mp3" loop autoplay></audio>

  <div id="resetDialog" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
    <div class="dialog-content">
      <h2 id="resetTitle">Are you sure you want to reset ?</h2>
      <p>You'll lose all progression</p>
      <div class="dialog-actions">
        <button id="confirmReset" type="button">Yes</button>
        <button id="cancelReset" type="button">No</button>
      </div>
    </div>
  </div>



  <script>
    let aura = 0;
    let auraPerClick = 1;
    let auraPerSecond = 0;

    const auraCountElem = document.getElementById("auraCount");
    const auraPerClickElem = document.getElementById("auraPerClick");
    const auraPerSecondElem = document.getElementById("auraPerSecond");
    const auraframe = document.getElementById("auraframe");
    const shop = document.getElementById("shop");
    const chad = document.getElementById("chad");
    const backgroundMusic = document.getElementById("backgroundMusic");
    const musicToggle = document.getElementById("musicToggle");
    const soundToggle = document.getElementById("soundToggle");
    const resetButton = document.getElementById("resetButton");
    const resetDialog = document.getElementById("resetDialog");
    const confirmReset = document.getElementById("confirmReset");
    const cancelReset = document.getElementById("cancelReset");
    const clickSound = new Audio("click.mp3");
    const MUSIC_VOLUME = 0.12;
    let musicMuted = false;
    let soundsMuted = false;
    let audioContext;

    const SAVE_KEY = "auraClickerProgress";
    const upgrades = [
      { name: "Cows", description: "Cows make milk", cost: 50, apc: 1, aps: 0, bought: 0 },
      { name: "Farmers", description : "They're very important", cost: 200, apc: 2, aps: 1, bought: 0 },
      { name: "Milk™ Factories", description : "It's literrally making milk", cost: 1000, apc: 5, aps: 5, bought: 0 },
      { name: "Milk™ Fans", description : "You're one of them, right ?", cost: 5000, apc: 20, aps: 20, bought: 0 },
      { name: "Super Cows", description : "How ?", cost: 15000, apc: 50, aps: 60, bought: 0 },
      { name: "Milk™ Rivers", description : "Look ! Milk rivers !", cost: 30000, apc: 100, aps: 120, bought: 0 },
      { name: "Milk™ Lakes", description : "You can swim in it", cost: 60000, apc: 250, aps: 250, bought: 0 },
      { name: "Milk™ Seas", description : "The sand at the bottom is sugar", cost: 100000, apc: 400, aps: 500, bought: 0 },
      { name: "Milk™ Ocean", description : "How do you add new oceans ??", cost: 250000, apc: 1000, aps: 1200, bought: 0 },
      { name: "Chocolate Cows", description : "How ????", cost: 500000, apc: 2000, aps: 2500, bought: 0 },
      { name: "Chocolate Milk™ Factories", description : "Our new Chocolate Milk™ is available", cost: 1000000, apc: 4000, aps: 6000, bought: 0 },
      { name: "Chocolate Milk™ Rivers", description :"Those rivers are tasty", cost: 2000000, apc: 7000, aps: 8000, bought: 0 },
      { name: "Our new Strawberry Milk™", description :"You can get them for cheap on our website", cost: 5000000, apc: 12000, aps: 15000, bought: 0 },
      { name: "Our new Vanilla Milk™", description :"You can get them for cheap on our website", cost: 10000000, apc: 20000, aps: 25000, bought: 0 },
      { name: "Vintage 1970's Milk™ bottles", description : "Remember those good days ?", cost: 20000000, apc: 40000, aps: 60000, bought: 0 },
      { name: "Super Milk™ Factories", description : "They are so super they could go in space", cost: 50000000, apc: 80000, aps: 100000, bought: 0 },
      { name: "Space Milk™ Factories", description : "There it is, they're in space now", cost: 100000000, apc: 200000, aps: 250000, bought: 0 },
      { name: "Milk™ Rockets", description : "Using the power of milk to refuel the ships", cost: 500000000, apc: 500000, aps: 600000, bought: 0 },
      { name: "Saving the planet with Ethical Milk™ (max 1)", description : "Everything's calm now", cost: 1000000000, apc: 1000000, aps: 2000000, bought: 0, maxPurchases: 1 }
    ].map(upgrade => ({
      ...upgrade,
      baseCost: upgrade.cost
    }));

    function formatNumber(value) {
      const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
      const number = Math.floor(value);
      if (number < 1000) return String(number);

      const group = Math.min(Math.floor(Math.log10(number) / 3), suffixes.length - 1);
      const scaled = number / Math.pow(1000, group);
      const decimals = scaled < 10 ? 2 : scaled < 100 ? 1 : 0;
      return `${scaled.toFixed(decimals).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1")}${suffixes[group]}`;
    }

    function saveProgress() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          aura,
          auraPerClick,
          auraPerSecond,
          upgrades: upgrades.map(({ cost, bought }) => ({ cost, bought }))
        }));
      } catch {
        // La partie continue même si le navigateur interdit le stockage local.
      }
    }

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!saved) return;
        if (Number.isFinite(saved.aura)) aura = saved.aura;
        if (Number.isFinite(saved.auraPerClick)) auraPerClick = saved.auraPerClick;
        if (Number.isFinite(saved.auraPerSecond)) auraPerSecond = saved.auraPerSecond;
        saved.upgrades?.forEach((savedUpgrade, i) => {
          if (!upgrades[i]) return;
          if (Number.isFinite(savedUpgrade.cost)) upgrades[i].cost = savedUpgrade.cost;
          if (Number.isInteger(savedUpgrade.bought)) upgrades[i].bought = savedUpgrade.bought;
        });
      } catch {
        localStorage.removeItem(SAVE_KEY);
      }
    }

    function resetGame() {
      aura = 0;
      auraPerClick = 1;
      auraPerSecond = 0;
      upgrades.forEach(upgrade => {
        upgrade.cost = upgrade.baseCost;
        upgrade.bought = 0;
      });
      resetDialog.classList.remove("visible");
      updateStats();
    }

    upgrades.forEach((u, i) => {
      const div = document.createElement("div");
      div.className = "upgrade";
      div.innerHTML = `
        <h3>${u.name} <span id="count-${i}">x0</span></h3>
        <p>  ${u.description}</p>
        <p class="upgrade-gains">${[
          u.apc > 0 ? `+${formatNumber(u.apc)} Money per click` : "",
          u.aps > 0 ? `+${formatNumber(u.aps)} Money per second` : ""
        ].filter(Boolean).join("<br>")}</p>
        <p class="upgrade-cost">Cost : <span id="cost-${i}">${formatNumber(u.cost)}</span></p>
        <button id="buy-${i}" disabled>Buy</button>
      `;
      shop.appendChild(div);
    });

    function playSound(frequency, duration, type = "sine") {
      if (soundsMuted) return;
      audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.12, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playClickSound() {
      if (soundsMuted) return;
      const sound = clickSound.cloneNode();
      sound.play().catch(() => {});
    }

    function startMusic() {
      if (!musicMuted) backgroundMusic.play().catch(() => {});
    }

    backgroundMusic.volume = MUSIC_VOLUME;
    startMusic();
    document.addEventListener("pointerdown", startMusic, { once: true });

    musicToggle.addEventListener("click", () => {
      musicMuted = !musicMuted;
      backgroundMusic.muted = musicMuted;
      musicToggle.textContent = `Musique : ${musicMuted ? "coupée" : "activée"}`;
      musicToggle.classList.toggle("muted", musicMuted);
      if (!musicMuted) startMusic();
    });

    soundToggle.addEventListener("click", () => {
      soundsMuted = !soundsMuted;
      soundToggle.textContent = `Sons : ${soundsMuted ? "coupés" : "activés"}`;
      soundToggle.classList.toggle("muted", soundsMuted);
    });

    resetButton.addEventListener("click", () => resetDialog.classList.add("visible"));
    cancelReset.addEventListener("click", () => resetDialog.classList.remove("visible"));
    confirmReset.addEventListener("click", resetGame);

    document.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() === "c" && !event.ctrlKey && !event.metaKey && !event.altKey) {
        aura += 1;
        updateStats();
        spawnFloatingText(window.innerWidth / 2, window.scrollY + 80, "WHAT ?");
      }
    });

    function updateStats() {
      auraCountElem.textContent = `Money : ${formatNumber(aura)}`;
      auraPerClickElem.textContent = `Money per click : ${formatNumber(auraPerClick)}`;
      auraPerSecondElem.textContent = `Money per second : ${formatNumber(auraPerSecond)}`;

      upgrades.forEach((u, i) => {
        const btn = document.getElementById(`buy-${i}`);
        document.getElementById(`count-${i}`).textContent = `x${u.bought}`;
        document.getElementById(`cost-${i}`).textContent = formatNumber(u.cost);
        document.getElementById(`cost-${i}`).classList.toggle("unaffordable", aura < u.cost);
        const limitReached = u.maxPurchases !== undefined && u.bought >= u.maxPurchases;
        if (limitReached) {
          btn.classList.remove("enabled");
          btn.disabled = true;
          btn.textContent = "Maximum reached";
        } else if (aura >= u.cost) {
          btn.classList.add("enabled");
          btn.disabled = false;
          btn.textContent = "Buy";
        } else {
          btn.classList.remove("enabled");
          btn.disabled = true;
          btn.textContent = "Buy";
        }
      });
      saveProgress();
    }

    auraframe.addEventListener("click", (e) => {
      aura += auraPerClick;
      updateStats();
      spawnFloatingText(e.pageX || (auraframe.getBoundingClientRect().left + auraframe.clientWidth / 2), e.pageY || (auraframe.getBoundingClientRect().top + window.scrollY + auraframe.clientHeight / 2), `+${formatNumber(auraPerClick)}`);
      playClickSound();
    });

    upgrades.forEach((u, i) => {
      document.getElementById(`buy-${i}`).addEventListener("click", () => {
        if (aura >= u.cost && (u.maxPurchases === undefined || u.bought < u.maxPurchases)) {
          aura -= u.cost;
          auraPerClick += u.apc;
          auraPerSecond += u.aps;
          u.bought++;
          u.cost = Math.floor(u.cost * 1.3);
          document.getElementById(`count-${i}`).textContent = `x${u.bought}`;
          document.getElementById(`cost-${i}`).textContent = formatNumber(u.cost);
          playClickSound();
          updateStats();
        }
      });
    });

    function spawnFloatingText(x, y, text) {
      const div = document.createElement("div");
      div.className = "floating-text";
      div.style.left = x + "px";
      div.style.top = y + "px";
      div.textContent = text;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 1000);
    }

    setInterval(() => {
      aura += auraPerSecond;
      updateStats();
    }, 1000);

    function trySpawnChad() {
      if (Math.random() < 0.002) {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        chad.style.left = x + "px";
        chad.style.top = y + "px";
        chad.style.opacity = 1;
        chad.style.pointerEvents = "auto";

        const removeTimeout = setTimeout(() => {
          chad.style.opacity = 0;
          setTimeout(() => chad.style.pointerEvents = "none", 200);
        }, 10000);

        chad.onclick = (e) => {
        chad.style.opacity = 0;
        chad.style.pointerEvents = "none";
          aura += auraPerClick * 50;
          updateStats();
          spawnFloatingText(e.pageX, e.pageY, `+${formatNumber(auraPerClick * 50)}`);
          playSound(180, 0.3, "sawtooth");
          clearTimeout(removeTimeout);
        };
      };
    };

    setInterval(trySpawnChad, 300);

    loadProgress();
    updateStats();
  </script>
</body>
</html>
